<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f2342" />
    <meta name="description" content="SHENA Express — Plateforme logistique, suivi des commandes et des colis vers Haïti." />
    <link rel="stylesheet" href="/loading.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>SHENA Express — Logistique &amp; suivi de colis</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-700 selection:text-white">
    <div id="root">
      <div class="shena-loading shena-loading-fullscreen" role="status" aria-live="polite" aria-busy="true">
        <div class="shena-loading-brand"><img src="/favicon.svg" alt="" width="54" height="54" /><span>SHENA <em>Express</em></span></div>
        <img class="shena-loading-route" src="/loading-route.svg" alt="Miami → République dominicaine → Haïti" width="360" height="165" />
        <p class="shena-loading-label">Chargement de SHENA Express…</p>
      </div>
    </div>
    <noscript>Activez JavaScript pour vous connecter à SHENA Express et suivre vos colis.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
